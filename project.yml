name: Teleprompter
options:
  bundleIdPrefix: dev.nacho
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  TeleprompterCore:
    path: TeleprompterCore
targets:
  Teleprompter:
    type: application
    platform: macOS
    sources:
      - Teleprompter
    dependencies:
      - package: TeleprompterCore
    info:
      path: Teleprompter/Info.plist
      properties:
        CFBundleDisplayName: Teleprompter
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Teleprompter listens to your voice to follow the script as you read and can optionally record the audio.
        NSSpeechRecognitionUsageDescription: Teleprompter transcribes your voice on this Mac to know where you are in the script.
    entitlements:
      path: Teleprompter/Teleprompter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.assets.movies.read-write: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nacho.Teleprompter
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
